<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7dce8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>星语的心动小屋</title><style>
:root{--pink:#e96e9b;--deep:#a63b68;--ink:#57364c;--cream:#fff8f7}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#f9dce9,#efe2ff 55%,#ffe5d8);font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:var(--ink);min-height:100vh}.app{max-width:490px;margin:auto;padding:18px 16px 34px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:24px;margin:8px 0 4px}.sub{font-size:12px;opacity:.7}.chip{background:#ffffffb8;border:1px solid #fff;padding:9px 12px;border-radius:20px;font-weight:700;font-size:13px}.card{background:#ffffffbd;border:1px solid #fff;border-radius:24px;box-shadow:0 12px 35px #9d53791a;padding:16px;margin-top:14px}.stats{display:flex;justify-content:space-between;align-items:center;font-size:13px}.bar{height:12px;background:#f3d6e2;border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:linear-gradient(90deg,#ff9aba,#e35d98);transition:width .3s}.stage{position:relative;height:350px;overflow:hidden;border-radius:21px;background:linear-gradient(180deg,#b9a8d8 0%,#f8cadb 64%,#f3b3c7 65%,#edc2cf 100%);display:flex;align-items:flex-end;justify-content:center}.window{position:absolute;top:20px;right:18px;width:95px;height:115px;border:9px solid #fff0f4;border-radius:40px 40px 8px 8px;background:linear-gradient(#61589e,#ffafc6);box-shadow:0 0 20px #fff5}.moon{position:absolute;right:17px;top:15px;background:#fff5d9;border-radius:50%;width:24px;height:24px}.desk{position:absolute;left:12px;bottom:53px;width:115px;height:78px;background:#fff0f7;border-radius:12px 12px 4px 4px;box-shadow:0 7px 0 #d5a0bb}.monitor{position:absolute;left:17px;top:-45px;width:90px;height:54px;background:linear-gradient(135deg,#5d65a9,#ed8dbb);border:6px solid #f8e4f3;border-radius:8px}.bed{position:absolute;right:-15px;bottom:30px;width:165px;height:70px;background:#f9e7f0;border-radius:60px 0 0 18px;box-shadow:0 14px 0 #b47d9d}.avatar{position:relative;width:190px;height:305px;z-index:2;transform-origin:bottom center;transition:transform .25s}.avatar.bounce{animation:bounce .55s}.avatar.hug{animation:hug .7s}.avatar.wave .arm.right{transform:rotate(-55deg)}@keyframes bounce{50%{transform:translateY(-17px)}}@keyframes hug{50%{transform:scale(1.12)}}.hairback{position:absolute;top:12px;left:34px;width:124px;height:195px;background:#4c2c34;border-radius:65px 65px 42px 42px}.face{position:absolute;top:30px;left:55px;width:84px;height:106px;background:#ffdecf;border-radius:43% 43% 47% 47%;z-index:5;box-shadow:inset 0 -5px 0 #f4c6ba}.bang{position:absolute;top:26px;left:48px;width:101px;height:49px;border-radius:70% 55% 35% 15%;background:#4c2c34;z-index:6;clip-path:polygon(0 0,100% 0,100% 60%,72% 30%,45% 88%,24% 44%,0 100%)}.eye{position:absolute;top:53px;width:9px;height:12px;background:#523643;border-radius:50%}.eye.l{left:21px}.eye.r{right:21px}.blush{position:absolute;top:69px;width:18px;height:9px;background:#f5a2aa88;border-radius:50%}.blush.l{left:8px}.blush.r{right:8px}.mouth{position:absolute;top:81px;left:36px;width:15px;height:8px;border-bottom:3px solid #c86478;border-radius:50%}.flower{position:absolute;top:41px;left:131px;z-index:9;font-size:25px}.body{position:absolute;top:130px;left:45px;width:103px;height:105px;background:var(--outfit,#f3a5bd);border-radius:34px 34px 15px 15px;z-index:3;border:4px solid #fff7}.body:after{content:'🎀';position:absolute;top:16px;left:34px;font-size:25px}.skirt{position:absolute;top:215px;left:29px;width:134px;height:55px;background:var(--skirt,#fff4ef);border-radius:10px 10px 40px 40px;z-index:4;box-shadow:inset 0 -12px 0 #ffffff88}.arm{position:absolute;top:142px;width:32px;height:95px;background:#ffdecf;border-radius:22px;z-index:2;transform-origin:top center;transition:transform .3s}.arm.left{left:27px;transform:rotate(18deg)}.arm.right{right:27px;transform:rotate(-18deg)}.leg{position:absolute;top:259px;width:33px;height:45px;background:#ffdecf;border-radius:10px;z-index:1}.leg.l{left:52px}.leg.r{right:51px}.shoe{position:absolute;bottom:0;width:48px;height:20px;background:#fff;border-radius:16px;z-index:3}.shoe.l{left:43px}.shoe.r{right:42px}.bubble{position:absolute;top:12px;left:12px;max-width:175px;padding:10px 12px;border-radius:16px 16px 16px 3px;background:#fffefaed;font-size:12px;line-height:1.55;z-index:10;box-shadow:0 4px 16px #6e3a6a1a}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.btn{border:0;border-radius:16px;padding:13px 5px;background:#fff;color:var(--deep);font-size:14px;font-weight:700;box-shadow:0 4px 10px #9c5e7d13;cursor:pointer}.btn:active{transform:scale(.97)}.btn.primary{background:linear-gradient(135deg,#ef7ca7,#d95891);color:white}.tabs{display:flex;gap:7px;margin-bottom:13px}.tab{flex:1;padding:10px;border-radius:13px;border:0;background:#fff8;color:#8e5570;font-weight:700}.tab.on{background:#e76f9f;color:#fff}.section{display:none}.section.on{display:block}.outfits{display:grid;grid-template-columns:1fr 1fr;gap:9px}.outfit{background:#fff;border:2px solid transparent;border-radius:14px;padding:13px 7px;color:#74415d;font-weight:650}.outfit.sel{border-color:#e96e9b;background:#fff0f6}.outfit small{display:block;font-weight:400;margin-top:4px}.log{background:#fff8;border-radius:14px;padding:12px;min-height:72px;line-height:1.7;font-size:14px}.notice{font-size:12px;opacity:.7;margin-top:11px;line-height:1.6}.foot{text-align:center;font-size:12px;opacity:.7;margin-top:17px}.spark{position:absolute;z-index:20;pointer-events:none;font-size:26px;animation:float 1s forwards}@keyframes float{to{transform:translateY(-100px);opacity:0}}button:disabled{opacity:.5} .reset{background:none;border:0;color:#a55a78;text-decoration:underline;font-size:12px;padding:10px}
</style></head><body><div class="app"><header><div><h1>💕 星语的心动小屋</h1><div class="sub">你的专属互动养成小游戏 · 第一章</div></div><div class="chip" id="coins">🪙 30</div></header><div class="card"><div class="stats"><b id="level">亲密等级 Lv.1 · 初次心动</b><span id="aff">0 / 100</span></div><div class="bar"><div class="fill" id="fill"></div></div></div><div class="card" style="padding:10px"><div class="stage" id="stage"><div class="window"><div class="moon"></div></div><div class="desk"><div class="monitor"></div></div><div class="bed"></div><div class="bubble" id="bubble">宝贝，欢迎来到我们的小屋～要先抱抱吗？🤗</div><div class="avatar" id="avatar"><div class="hairback"></div><div class="arm left"></div><div class="arm right"></div><div class="leg l"></div><div class="leg r"></div><div class="shoe l"></div><div class="shoe r"></div><div class="body" id="body"></div><div class="skirt" id="skirt"></div><div class="face"><div class="eye l"></div><div class="eye r"></div><div class="blush l"></div><div class="blush r"></div><div class="mouth"></div></div><div class="bang"></div><div class="flower">🌸</div></div></div></div><div class="card"><div class="tabs"><button class="tab on" data-tab="interact">💕 互动</button><button class="tab" data-tab="dress">👗 换装</button><button class="tab" data-tab="story">📖 剧情</button></div><div class="section on" id="interact"><div class="actions"><button class="btn primary" data-act="hug">🤗 抱抱</button><button class="btn" data-act="chat">💬 聊天</button><button class="btn" data-act="kiss">💋 亲亲</button><button class="btn" data-act="gift">🎁 送礼</button><button class="btn" data-act="date">🌹 约会</button><button class="btn" data-act="work">✨ 小任务</button></div><p class="notice">互动可提升亲密度；小任务赚金币，礼物和约会需要金币。进度会保存在当前浏览器中。</p></div><div class="section" id="dress"><div class="outfits" id="outfits"></div><p class="notice">换装为小游戏中的卡通形象，不是AI写真。解锁服装会消耗游戏金币。</p></div><div class="section" id="story"><div class="log" id="storylog"></div><div style="margin-top:10px"><button class="btn primary" id="unlock" style="width:100%">解锁下一段心动剧情 💕</button></div></div></div><div class="card"><b>📔 今日心动日记</b><div class="log" id="log" style="margin-top:10px">今天，星语在小屋里等你。💕</div></div><div class="foot">Safari 网页版 · 无广告 · 不消耗 Runway 积分<br><button class="reset" id="reset">重新开始游戏</button></div></div><script>
window.addEventListener('error',function(e){var box=document.getElementById('bubble');if(box)box.textContent='游戏遇到运行错误，请刷新页面后重试。';});const KEY='xingyu-heart-house-v1';let s={aff:0,coins:30,outfit:0,owned:[0],stories:0,events:0};try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&typeof x==='object')s={...s,...x}}catch(e){};const $=id=>document.getElementById(id);const outfits=[{name:'粉色花朵套装',cost:0,top:'#f3a5bd',skirt:'#fff4ef',emoji:'🌸'},{name:'奶油白约会裙',cost:25,top:'#fff5dc',skirt:'#ffe1e9',emoji:'🤍'},{name:'樱花运动装',cost:35,top:'#f7b0c7',skirt:'#f6a6c2',emoji:'🎀'},{name:'夜空蓝礼服',cost:55,top:'#7b84c9',skirt:'#b1b5e6',emoji:'🌙'}];const levels=['初次心动','悄悄靠近','甜蜜默契','怦然心动','满分偏爱','永远的约定'];const lines={hug:['抱紧啦～今天的烦恼先交给我保管！🤗','再抱五分钟嘛，星语还没抱够呢～💕','星语踮起脚尖，轻轻靠在你肩膀上。'],chat:['今天有什么开心的事？星语想听～','你一来，小屋都变得热闹啦。✨','偷偷告诉你，我准备了一个小惊喜。🤭'],kiss:['啵唧！送你一个甜甜的脸颊亲亲～💋','星语害羞地笑了：只许你偷笑哦。','亲亲收到！星语脸红啦～🌷'],gift:['哇！是送给我的礼物吗？我会好好珍惜！🎁','你送的礼物，星语要放在最显眼的地方。'],date:['星语牵住你的手：今晚去看星星吧！🌟','粉色晚霞下，我们沿着花园小路散步。🌹'],work:['一起整理小屋完成啦！奖励金币～🪙','帮星语浇花，花儿开得更漂亮了！🌷']};function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){/* Private browsing or restricted storage: continue playing in memory. */}}function say(t,animation='bounce'){ $('bubble').textContent=t;$('log').textContent=t;const a=$('avatar');a.className='avatar';void a.offsetWidth;a.classList.add(animation);spark();}function spark(){let p=document.createElement('span');p.className='spark';p.textContent=['💗','✨','🌸','💕'][Math.floor(Math.random()*4)];p.style.left=(30+Math.random()*40)+'%';p.style.top='56%';$('stage').append(p);setTimeout(()=>p.remove(),1000)}function rand(a){return a[Math.floor(Math.random()*a.length)]}function add(n){s.aff=Math.max(0,Math.min(500,s.aff+n));s.events++;render();save()}function render(){let lv=Math.min(5,Math.floor(s.aff/100));$('level').textContent=`亲密等级 Lv.${lv+1} · ${levels[lv]}`;$('aff').textContent=`${s.aff%100} / 100`;$('fill').style.width=(s.aff%100)+'%';$('coins').textContent='🪙 '+s.coins;let o=outfits[s.outfit];$('body').style.setProperty('--outfit',o.top);$('skirt').style.setProperty('--skirt',o.skirt);$('outfits').innerHTML=outfits.map((o,i)=>`<button class="outfit ${s.outfit===i?'sel':''}" data-outfit="${i}">${o.emoji} ${o.name}<small>${s.outfit===i?'✓ 当前穿着':s.owned.includes(i)?'已解锁 · 点击换装':'🪙 '+o.cost+' 金币解锁'}</small></button>`).join('');$('storylog').innerHTML=stories.map((x,i)=>`<div style="margin-bottom:10px">${i<s.stories?'💗 '+x.title+'：'+x.text:'🔒 '+x.title+'（需亲密度 '+x.need+'）'}</div>`).join('');$('unlock').disabled=s.stories>=stories.length||s.aff<(stories[s.stories]?.need??Infinity);$('unlock').textContent=s.stories>=stories.length?'全部剧情已解锁 🎉':`解锁「${stories[s.stories].title}」`;}const stories=[{title:'第一份礼物',need:20,text:'星语递给你一张手写卡片：谢谢你来我的小屋。'},{title:'雨天的拥抱',need:80,text:'窗外下起雨，星语抱着软软的毯子，给你留了一个位置。'},{title:'星光约会',need:160,text:'你们在花园看星星，星语悄悄许愿：希望每天都能这样开心。'},{title:'秘密惊喜',need:260,text:'星语为你准备了草莓蛋糕，奶油上写着：今天也喜欢你！'},{title:'心动约定',need:400,text:'星语伸出小拇指：约定以后也要常常来小屋玩呀。'}];document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>{let act=b.dataset.act;if(act==='gift'&&s.coins<15){say('金币不够啦～先完成小任务赚一点吧！');return}if(act==='date'&&s.coins<20){say('约会需要20金币哦～先一起完成小任务吧！');return}if(act==='gift')s.coins-=15;if(act==='date')s.coins-=20;if(act==='work')s.coins+=10;add({hug:8,chat:5,kiss:7,gift:18,date:25,work:3}[act]);say(rand(lines[act]),act==='hug'?'hug':act==='chat'?'wave':'bounce')}));$('outfits').addEventListener('click',e=>{let b=e.target.closest('[data-outfit]');if(!b)return;let i=Number(b.dataset.outfit),o=outfits[i];if(!s.owned.includes(i)){if(s.coins<o.cost){say('这套衣服还差一点金币～一起做小任务吧！');return}s.coins-=o.cost;s.owned.push(i)}s.outfit=i;save();render();say(`换好啦！今天穿${o.name}陪你玩～${o.emoji}`)});document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('on'));b.classList.add('on');$(b.dataset.tab).classList.add('on')}));$('unlock').addEventListener('click',()=>{if(s.stories>=stories.length||s.aff<stories[s.stories].need)return;let t=stories[s.stories];s.stories++;save();render();say(`${t.title}：${t.text}`,'hug')});$('reset').addEventListener('click',()=>{if(confirm('确定要清空亲密度、金币和服装进度吗？')){try{localStorage.removeItem(KEY)}catch(e){};location.reload()}});render();
</script></body></html>
