epeat(3,1fr);gap:9px}.action{padding:12px 5px;border-radius:16px;background:linear-gradient(160deg,#ffe9f3,#f6c5dd);color:#8c3463;font-weight:700;font-size:13px}.tabs{display:flex;gap:6px}.tab{flex:1;border-radius:15px;padding:12px 3px;background:#fff8;color:#8d5170;font-size:13px}.tab.active{background:#df6a9d;color:white}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choice{background:#fff;border:1px solid #f2c5d9;border-radius:15px;padding:12px 8px;color:#8a3d66;font-size:13px}.choice.selected{background:#fce2ee;border-color:#d95691}.note{font-size:12px;opacity:.78;line-height:1.5}.log{max-height:145px;overflow:auto;font-size:12px;line-height:1.8}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.hidden{display:none}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#763a5ce8;color:white;padding:11px 16px;border-radius:20px;z-index:10;display:none;max-width:90vw;text-align:center;font-size:13px}.heart{position:absolute;z-index:4;left:50%;top:40%;font-size:48px;pointer-events:none;animation:fly .9s forwards}@keyframes fly{from{transform:translate(-50%,0) scale(.5);opacity:1}to{transform:translate(-50%,-100px) scale(1.7);opacity:0}}@media(max-width:360px){.scene{min-height:355px}h1{font-size:20px}}
</style></head><body><main class="app"><header><div><h1>💗 星语的心动小屋</h1><small>第二版 · 写实互动体验</small></div><button class="pill" id="checkin">📅 每日签到</button></header><section class="card"><div class="stats"><b id="level">💕 亲密度 Lv.1</b><b id="money">🪙 100</b><span id="room">🏠 电竞卧室</span></div><div class="progress"><i id="progress"></i></div><div class="stats"><span id="affection">亲密度 0</span><span id="days">已相伴 0 天</span></div></section><section class="card"><div class="scene" id="scene" data-scene="电竞卧室" data-outfit="粉色蕾丝"><div class="portrait" id="portrait"></div><div class="overlay"></div><span class="tag" id="outfitTag">🌸 粉色蕾丝 · 奶油白开衫</span><div class="bubble" id="bubble">宝贝～欢迎回到我们的心动小屋！今天想和星语做些什么呢？🥰</div></div><p class="note">✨ 写实角色为游戏插画；互动通过表情动画与文字呈现，并非实时生成的视频。</p><div class="actions"><button class="action" data-action="聊天">💬 聊天</button><button class="action" data-action="抱抱">🤗 抱抱</button><button class="action" data-action="飞吻">💋 飞吻</button><button class="action" data-action="摸头">🥰 摸头</button><button class="action" data-action="牵手">🤝 牵手</button><button class="action" data-action="送花">🌹 送花 -20🪙</button></div></section><section class="card"><div class="tabs"><button class="tab active" data-tab="换装">👗 换装</button><button class="tab" data-tab="场景">🏡 场景</button><button class="tab" data-tab="剧情">📖 剧情</button></div><div id="panel" style="margin-top:13px"></div></section><section class="card"><div class="row"><b>📔 心动日记</b><button class="pill" id="reset">重置进度</button></div><div class="log" id="log"></div></section><p class="note" style="text-align:center">离线可玩 · 自动保存在本机浏览器 · 不消耗 Runway 积分</p></main><div class="toast" id="toast"></div><script>
(()=>{"use strict";const $=id=>document.getElementById(id);const KEY="xingyu-heart-house-v2";const oldKey="xingyu-heart-house-v1";const base={aff:0,money:100,days:0,last:"",outfit:"粉色蕾丝",scene:"电竞卧室",log:[],tab:"换装"};let s={...base};try{let v=JSON.parse(localStorage.getItem(KEY)||"null");if(v)s={...base,...v};else{let old=JSON.parse(localStorage.getItem(oldKey)||"null");if(old){s.aff=Number(old.aff||old.affection||old.love||0)||0;s.money=Number(old.coins||old.money||100)||100;}}}catch(e){}function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}function say(t){$("bubble").textContent=t;const p=$("portrait");p.style.transform="scale(1.045) translateY(-3px)";setTimeout(()=>p.style.transform="",420)}function toast(t){$("toast").textContent=t;$("toast").style.display="block";clearTimeout(window._t);window._t=setTimeout(()=>$("toast").style.display="none",2100)}function addLog(t){s.log.unshift(new Date().toLocaleDateString("zh-CN")+" · "+t);s.log=s.log.slice(0,25)}function heart(){let h=document.createElement("span");h.className="heart";h.textContent="💗";$("scene").append(h);setTimeout(()=>h.remove(),950)}function render(){const lvl=1+Math.floor(s.aff/100);$("level").textContent="💕 亲密度 Lv."+lvl;$("affection").textContent="亲密度 "+s.aff;$("money").textContent="🪙 "+s.money;$("days").textContent="已签到 "+s.days+" 天";$("progress").style.width=s.aff%100+"%";$("room").textContent="🏠 "+s.scene;$("scene").dataset.scene=s.scene;$("scene").dataset.outfit=s.outfit;$("outfitTag").textContent="🌸 "+s.outfit;$("log").innerHTML=s.log.map(x=>"<div>"+escapeHtml(x)+"</div>").join("")||"第一篇日记，等你来写～";document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===s.tab));let content="";if(s.tab==="换装"){content='<div class="grid">'+["粉色蕾丝","奶油白针织","晚礼服","休闲装"].map(x=>'<button class="choice '+(s.outfit===x?"selected":"")+'" data-outfit="'+x+'">👗 '+x+'</button>').join("")+'</div><p class="note">提示：目前服装选择会改变游戏状态和部分画面色调；不同服装的独立写真尚未制作。</p>'}else if(s.tab==="场景"){content='<div class="grid">'+["电竞卧室","花园","客厅"].map(x=>'<button class="choice '+(s.scene===x?"selected":"")+'" data-scene="'+x+'">🏡 '+x+'</button>').join("")+'</div><p class="note">场景切换目前以背景氛围和剧情变化呈现。</p>'}else{const stories=[["初次心动",0,"星语在灯光下回头，笑着说：终于等到你啦。"],["雨夜拥抱",60,"窗外雨声轻响，星语把温暖的毯子分给你。"],["花园约会",150,"你们在花园里慢慢散步，约定下次再一起看星星。"],["小小惊喜",260,"星语端出亲手准备的草莓蛋糕，笑着向你眨眼。"]];content=stories.map(([name,n,t])=>'<button class="choice" style="width:100%;text-align:left;margin-bottom:8px" data-story="'+n+'" '+(s.aff<n?"disabled":"")+'>'+ (s.aff<n?"🔒":"💌")+' '+name+(s.aff<n?" · 需要亲密度 "+n:"")+'</button>').join("")} $("panel").innerHTML=content;save()}function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}const lines={"聊天":["今天辛苦啦～想听你讲讲今天发生的事。💕","嘿嘿，和你待在一起，连平凡的日子都很甜。","宝贝，记得喝水休息呀～"],"抱抱":["星语张开双臂，给你一个暖暖的拥抱～🤗","抱紧一点点，今天的疲惫都交给我吧。💕"],"飞吻":["啵唧！💋 这颗飞吻只送给你～","星语眨眨眼，悄悄送来一个飞吻～😘"],"摸头":["星语眯起眼睛，笑得像一只小猫咪。🐱","唔～被你摸摸头，心情都变好了。"],"牵手":["星语伸出小拇指：拉勾勾，今天也要开心！","十指轻轻相扣，一起慢慢散步吧。💕"],"送花":["哇～玫瑰！星语收到啦，谢谢宝贝！🌹"]};document.querySelectorAll("[data-action]").forEach(b=>b.addEventListener("click",()=>{const a=b.dataset.action;if(a==="送花"&&s.money<20){toast("金币不够啦，明天签到再来～");return}if(a==="送花")s.money-=20;s.aff+=a==="送花"?20:8;const l=lines[a];const t=l[Math.floor(Math.random()*l.length)];say(t);heart();addLog(a+" · "+t);render()}));$("checkin").addEventListener("click",()=>{const d=new Date().toLocaleDateString("en-CA");if(s.last===d){toast("今天已经签到过啦 💕");return}s.last=d;s.days++;s.money+=50;s.aff+=15;addLog("每日签到 +50金币 +15亲密度");say("签到成功！今天也要一起制造心动回忆呀～");heart();render()});document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{s.tab=b.dataset.tab;render()}));$("panel").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.outfit){s.outfit=b.dataset.outfit;say("换好啦～这套「"+s.outfit+"」你喜欢吗？");render()}if(b.dataset.scene){s.scene=b.dataset.scene;say("欢迎来到我们的"+s.scene+"～今天也要留下甜甜的回忆！");render()}if(b.dataset.story!==undefined){const stories={0:"星语在灯光下回头，笑着说：终于等到你啦。",60:"窗外雨声轻响，星语把温暖的毯子分给你。",150:"你们在花园里慢慢散步，约定下次再一起看星星。",260:"星语端出亲手准备的草莓蛋糕，笑着向你眨眼。"};say(stories[b.dataset.story]);addLog("解锁剧情 · "+stories[b.dataset.story]);render()}});$("reset").addEventListener("click",()=>{if(!confirm("确定重置第二版的游戏进度吗？"))return;s={...base,log:[]};say("欢迎重新开始我们的心动故事～");render()});render()})();
</script></body></html>
